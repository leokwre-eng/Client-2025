name: Mirror RR client to GitHub

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/download-client.yml'
      - '.github/workflows/blank.yml'
      - 'download.bat'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-client
  cancel-in-progress: false

jobs:
  fetch-client:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      MIRROR_URL: "https://s3.g.megas4.com/2koayuyiwxv4groxzwdbbxg43cwustavrkvfb/recflare/2025/client.zip"
      CLIENT_MD5: "6820e89bff41906ded7f5c066027f1d6"
      EXPECTED_SIZE: "3780378453"
    steps:
      - name: Probe mirror reachability
        run: |
          echo "--- ranged GET probe (this gateway rejects HEAD, so we probe with a 1-byte GET) ---"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 20 -r 0-0 "$MIRROR_URL")
            echo "probe $i: HTTP $code"
            if [ "$code" = "206" ] || [ "$code" = "200" ]; then echo "mirror reachable"; break; fi
            sleep 15
          done

      - name: Download Rec Room client from mirror (resume + retries)
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            echo "=== download attempt $i ==="
            curl -fL --connect-timeout 30 --retry 3 --retry-delay 10 --retry-all-errors \
                 -C - -o client.zip "$MIRROR_URL"
            rc=$?
            size=$(stat -c%s client.zip 2>/dev/null || echo 0)
            echo "curl exit code: $rc | size so far: $size / $EXPECTED_SIZE"
            if [ "$size" = "$EXPECTED_SIZE" ]; then ok=1; break; fi
            echo "incomplete - resuming in 30s"
            sleep 30
          done
          if [ "$ok" != "1" ]; then
            echo "FATAL: download never reached $EXPECTED_SIZE bytes (got $(stat -c%s client.zip 2>/dev/null || echo 0))"
            exit 1
          fi
          echo "--- verifying MD5 ---"
          md5sum client.zip
          echo "$CLIENT_MD5  client.zip" | md5sum -c -

      - name: Upload single-zip artifact (backup, kept 90 days)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: client-zip-full
          path: client.zip
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

      - name: Split into parts under the 2 GiB release-asset limit
        run: |
          split -b 1900m -d -a 1 client.zip client.zip.part-
          ls -l client.zip.part-*
          rm -f client.zip

      - name: Write rejoin instructions
        run: |
          {
            echo "Rec Room client (2025 mirror snapshot) - split into 2 parts"
            echo ""
            echo "client.zip is 3,780,378,453 bytes - too big for a single GitHub"
            echo "release asset (2 GiB cap). Rejoin on Windows with:"
            echo ""
            echo "  copy /b client.zip.part-0+client.zip.part-1 client.zip"
            echo ""
            echo "Verify MD5 (optional, expected 6820e89bff41906ded7f5c066027f1d6):"
            echo ""
            echo "  certutil -hashfile client.zip MD5"
            echo ""
            echo "Then extract with the Windows 10/11 built-in tool:"
            echo ""
            echo "  tar -xf client.zip -C ."
          } > REJOIN-INSTRUCTIONS.txt

      - name: Publish release with client parts (retries, resume-safe)
        run: |
          TAG=client-2025
          echo "--- diagnostics: token + permissions ---"
          gh auth status 2>&1 || true
          gh api "repos/$GITHUB_REPOSITORY" --jq '{permissions: .permissions, default_branch: .default_branch}' || true
          echo "--- create the release first (empty), with retries ---"
          created=0
          for i in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG already exists"; created=1; break; fi
            if gh release create "$TAG" --title "Rec Room client (2025)" --notes "Full Rec Room client zip (2025 mirror snapshot). MD5 of the rejoined client.zip: 6820e89bff41906ded7f5c066027f1d6. Split into 2 parts because GitHub caps release assets at 2 GiB each - see REJOIN-INSTRUCTIONS.txt for the one-line rejoin command."; then echo "release created"; created=1; break; fi
            echo "create attempt $i failed; retrying in 30s"; sleep 30
          done
          [ "$created" = "1" ] || { echo "FATAL: could not create release $TAG"; exit 1; }
          echo "--- upload each asset with retries ---"
          for f in client.zip.part-0 client.zip.part-1 REJOIN-INSTRUCTIONS.txt; do
            ok=0
            for i in 1 2 3 4 5; do
              if gh release upload "$TAG" "$f" --clobber; then echo "uploaded: $f"; ok=1; break; fi
              echo "upload attempt $i for $f failed; retrying in 30s"; sleep 30
            done
            [ "$ok" = "1" ] || { echo "FATAL: failed to upload $f"; exit 1; }
          done
          echo "--- final release state ---"
          gh release view "$TAG"
