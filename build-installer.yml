name: Build installer

on:
  push:
    branches: [main]
    paths:
      - 'RecFlareSetup.iss'
      - 'download.bat'
      - '.github/workflows/build-installer.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch installer icon from upstream
        shell: pwsh
        run: Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/recflare/client/2025/icon.ico' -OutFile icon.ico

      - name: Compile installer with Inno Setup
        shell: pwsh
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc RecFlareSetup.iss
          } else {
            & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' RecFlareSetup.iss
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecFlareSetup
          path: Output/RecFlareSetup.exe
          if-no-files-found: error
